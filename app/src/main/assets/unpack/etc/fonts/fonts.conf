			<string>Bookman Old Style</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Liberation Serif</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Poppins</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Inter</string>
		</edit>
