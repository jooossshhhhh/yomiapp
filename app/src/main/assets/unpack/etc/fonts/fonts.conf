<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- /etc/fonts/fonts.conf file to configure system font access -->
<fontconfig>

<!-- Prefer bundled LibreOffice and Yomi metric-compatible Office fonts before Android system fonts -->

	<dir>/data/data/com.yomi.app/user/fonts</dir>
	<dir>/data/data/com.yomi.app/files/fonts</dir>
	<dir>/system/fonts</dir>

	<!-- Strong metric-compatible Microsoft Office substitutions so Word line wraps and page breaks match -->
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Calibri</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Carlito</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Calibri Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Carlito</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Aptos</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Carlito</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Aptos Display</string>
		</test>
		<edit name="family" mode="assign" binding="same">
