	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Segoe UI</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Selawik</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Segoe UI Semibold</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Selawik Semibold</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family" compare="eq" ignore-blanks="true">
			<string>Segoe UI Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Selawik Light</string>
